<div class="fade-in">
  <div class="page-header">
    <div class="header-back">
      <a [routerLink]="listUrl" class="back-link" aria-label="Volver a la lista de platos">
        <lucide-icon name="chevron-left" aria-hidden="true" [size]="18"></lucide-icon>
      </a>
      <h1 class="page-title">{{ pageTitle }}</h1>
    </div>
  </div>

  @if (error()) {
    <div class="alert-error">{{ error() }}</div>
  }

  <form class="card form-card" (ngSubmit)="onSubmit()" novalidate>
    <div class="form-grid">
      <div class="form-group">
        <label class="field-label" for="dish-name">Nombre del plato</label>
        <input id="dish-name" type="text" class="form-control" [(ngModel)]="form.name" name="name" placeholder="Ensalada César" />
      </div>

      <div class="form-group">
        <label class="field-label" for="dish-price">Precio (€)</label>
        <input id="dish-price" type="number" class="form-control" [(ngModel)]="form.price" name="price" />
      </div>

      <div class="form-group">
        <label class="field-label" for="dish-category">Categoría</label>
        <select id="dish-category" class="form-control" [(ngModel)]="form.category" name="category">
          @for (c of categories; track c) {
            <option [value]="c">{{ getCategoryLabel(c) }}</option>
          }
        </select>
      </div>

      <div class="form-group">
        <label class="field-label" for="dish-available">Disponible</label>
        <select id="dish-available" class="form-control" [(ngModel)]="form.available" name="available">
          <option [ngValue]="true">Sí</option>
          <option [ngValue]="false">No</option>
        </select>
      </div>

      <div class="form-group form-full">
        <label class="field-label" for="dish-description">Descripción (opcional)</label>
        <textarea id="dish-description" class="form-control" [(ngModel)]="form.description" name="description" rows="3" placeholder="Una deliciosa ensalada con..."></textarea>
      </div>
    </div>

    <fieldset class="ingredients-section">
      <legend class="section-legend">Ingredientes del plato</legend>

      @if (form.ingredients.length > 0) {
        <div class="ingredient-chips">
          @for (ing of form.ingredients; track ing.ingredientId) {
            <div class="ingredient-chip">
              <span>{{ getIngredientName(ing.ingredientId) }} — {{ ing.quantity }}</span>
              <div class="chip-remove" (click)="removeIngredient(ing.ingredientId)">
                <lucide-icon name="trash-2" aria-hidden="true" [size]="12"></lucide-icon>
              </div>
            </div>
          }
        </div>
      }

      <div class="add-ingredient-row">
        <label class="sr-only" for="new-ingredient">Ingrediente</label>
        <select id="new-ingredient" class="form-control" [(ngModel)]="newIngredientId" name="newIngredientId">
          <option value="">Seleccionar ingrediente</option>
          @for (i of ingredientStore.ingredients(); track i.id) {
            <option [value]="i.id">{{ i.name }} ({{ i.unit }})</option>
          }
        </select>
        <label class="sr-only" for="new-ingredient-qty">Cantidad</label>
        <input id="new-ingredient-qty" type="number" class="form-control qty-input" [(ngModel)]="newIngredientQty" name="newIngredientQty" placeholder="Cant." />
        <div class="btn btn-secondary btn-sm" (click)="addIngredient()">
          <lucide-icon name="plus" aria-hidden="true" [size]="14"></lucide-icon>
        </div>
      </div>
    </fieldset>

    <div class="form-actions">
      <a class="btn btn-secondary" [routerLink]="listUrl">Cancelar</a>
      <button type="submit" class="btn btn-primary">
        @if (loading()) {
          Guardando...
        } @else {
          Guardar
        }
      </button>
    </div>
  </form>
</div>
